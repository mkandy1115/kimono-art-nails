# ----------------------------------------------------------------------------
# Render Blueprint for the KIMONO Art Nails API (alternative to Koyeb).
# In Render: New > Blueprint, point it at this repo. Render reads this file.
#
# NOTE: `rootDir: api` tells Render to build/run inside the api/ folder of the
# monorepo. Set DATABASE_URL in the Render dashboard to your Neon connection
# string (do NOT use Render's free PostgreSQL — it expires after 30 days).
# ----------------------------------------------------------------------------
services:
  - type: web
    name: kimono-art-nails-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
